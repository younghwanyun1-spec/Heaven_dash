<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 PDF 변환기</title>
<style>
/* 레이아웃: 상단 작업 패널(업로드·옵션·저장) + 아래 썸네일 그리드 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --fg:#1b2430; --muted:#5d6b7c;
  --line:#d7dde5; --accent:#0b6e8a; --accent-fg:#ffffff; --danger:#b4232c;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#11161d; --panel:#1a212b; --fg:#e6ebf1; --muted:#97a4b4;
    --line:#2d3744; --accent:#3fb3d3; --accent-fg:#06222b; --danger:#ef6b72; color-scheme:dark }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font)}
.wrap{max-width:1040px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 48px}
h1{font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:18px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.drop strong{display:block;font-size:1.05rem}
.drop span{color:var(--muted);font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:end}
.opts label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
select,input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=number]{width:90px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;padding:10px 20px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:20px;padding:0;list-style:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:3/4;background:var(--bg);display:grid;place-items:center;max-width:100%}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.meta{padding:8px 10px;display:grid;gap:6px}
.name{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;align-items:center}
.row button{padding:3px 9px;font-size:.85rem}
.row .del{margin-left:auto;color:var(--danger)}
.no{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>이미지 PDF 변환기</h1>
  <p class="sub">이미지를 올리고 순서를 정한 뒤, 한 개의 PDF로 저장합니다. 파일은 서버로 전송되지 않고 브라우저 안에서만 처리됩니다.</p>

  <div class="panel">
    <!-- 1. 업로드 -->
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="이미지 선택">
      <strong>이미지를 여기로 끌어다 놓거나 클릭해서 선택</strong>
      <span>JPG · PNG · WEBP · GIF · BMP, 여러 장 선택 가능</span>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>

    <!-- 옵션 -->
    <div class="opts">
      <label for="pageSize">용지
        <select id="pageSize">
          <option value="a4auto">A4 (이미지 방향 자동)</option>
          <option value="a4p">A4 세로</option>
          <option value="a4l">A4 가로</option>
          <option value="fit">이미지 원본 크기</option>
        </select>
      </label>
      <label for="margin">여백(mm)
        <input type="number" id="margin" min="0" max="50" value="10">
      </label>
      <label for="quality">화질
        <select id="quality">
          <option value="0.95">높음</option>
          <option value="0.85" selected>보통</option>
          <option value="0.7">낮음(용량 작게)</option>
        </select>
      </label>
      <label for="fname">파일 이름
        <input type="text" id="fname" value="이미지모음">
      </label>
    </div>

    <!-- 2·3. PDF 생성 + 다운로드 -->
    <div class="actions">
      <button class="primary" id="make" disabled>PDF로 저장</button>
      <button id="clear" disabled>모두 지우기</button>
      <span class="status" id="status">이미지 0장</span>
    </div>
  </div>

  <ul class="grid" id="list"></ul>
  <p class="empty" id="empty">아직 올린 이미지가 없습니다.</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileIn = $('file'), list = $('list');
  let items = []; // {file, url}

  /* ---------- 1. 업로드 ---------- */
  drop.addEventListener('click', () => fileIn.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } });
  fileIn.addEventListener('change', () => { addFiles(fileIn.files); fileIn.value = ''; });
  ['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

  function addFiles(files) {
    for (const f of files) if (f.type.startsWith('image/')) items.push({ file: f, url: URL.createObjectURL(f) });
    render();
  }

  function render() {
    list.innerHTML = '';
    items.forEach((it, i) => {
      const li = document.createElement('li');
      li.className = 'card';
      li.innerHTML = `
        <div class="thumb"><img alt=""></div>
        <div class="meta">
          <div class="name"></div>
          <div class="row">
            <span class="no">${i + 1}</span>
            <button data-a="up" ${i === 0 ? 'disabled' : ''} aria-label="앞으로">◀</button>
            <button data-a="down" ${i === items.length - 1 ? 'disabled' : ''} aria-label="뒤로">▶</button>
            <button data-a="del" class="del">삭제</button>
          </div>
        </div>`;
      li.querySelector('img').src = it.url;
      li.querySelector('.name').textContent = it.file.name;
      li.querySelector('.name').title = it.file.name;
      li.addEventListener('click', e => {
        const a = e.target.dataset && e.target.dataset.a;
        if (!a) return;
        if (a === 'up') [items[i - 1], items[i]] = [items[i], items[i - 1]];
        if (a === 'down') [items[i + 1], items[i]] = [items[i], items[i + 1]];
        if (a === 'del') { URL.revokeObjectURL(it.url); items.splice(i, 1); }
        render();
      });
      list.appendChild(li);
    });
    $('empty').hidden = items.length > 0;
    $('make').disabled = $('clear').disabled = items.length === 0;
    $('status').textContent = `이미지 ${items.length}장`;
  }

  $('clear').addEventListener('click', () => { items.forEach(it => URL.revokeObjectURL(it.url)); items = []; render(); });

  /* ---------- 2. 이미지 → JPEG 변환 ---------- */
  function loadImage(url) {
    return new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = url; });
  }
  async function toJpeg(url, quality) {
    const im = await loadImage(url);
    let w = im.naturalWidth, h = im.naturalHeight;
    const MAX = 5000;                       // 너무 큰 이미지는 축소(브라우저 캔버스 한계 대비)
    if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);   // PNG 투명 배경을 흰색으로
    ctx.drawImage(im, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    return { w, h, bytes: new Uint8Array(await blob.arrayBuffer()) };
  }

  /* ---------- 2. PDF 작성(외부 라이브러리 없이 직접 생성) ---------- */
  function buildPdf(images, opt) {
    const enc = new TextEncoder();
    const parts = [], offsets = [];
    let pos = 0;
    const add = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); pos += b.length; };
    const MM = 72 / 25.4;                          // mm → pt
    const A4 = [595.28, 841.89];
    const n = images.length;
    const total = 2 + n * 3;                       // 1:Catalog 2:Pages, 페이지당 Page/Contents/Image

    add('%PDF-1.4\n'); add(new Uint8Array([37, 226, 227, 207, 211, 10]));

    const obj = (id, body) => { offsets[id] = pos; add(`${id} 0 obj\n`); add(body); add('\nendobj\n'); };
    const kids = images.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);

    images.forEach((img, i) => {
      const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
      let W, H, m = opt.margin * MM;
      if (opt.size === 'fit') { W = img.w * 0.75; H = img.h * 0.75; m = 0; }
      else if (opt.size === 'a4p') [W, H] = A4;
      else if (opt.size === 'a4l') [H, W] = A4;
      else [W, H] = img.w > img.h ? [A4[1], A4[0]] : A4;

      // 여백 안에 비율 유지하며 가운데 배치
      const bw = W - 2 * m, bh = H - 2 * m;
      const s = Math.min(bw / img.w, bh / img.h);
      const dw = img.w * s, dh = img.h * s;
      const x = (W - dw) / 2, y = (H - dh) / 2;
      const f = v => v.toFixed(2);

      obj(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(W)} ${f(H)}] ` +
               `/Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
      const stream = `q ${f(dw)} 0 0 ${f(dh)} ${f(x)} ${f(y)} cm /Im${i} Do Q`;
      obj(cid, `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);

      offsets[iid] = pos;
      add(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} ` +
          `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>\nstream\n`);
      add(img.bytes);
      add('\nendstream\nendobj\n');
    });

    const xref = pos;
    let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
    for (let id = 1; id <= total; id++) x += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
    add(x);
    add(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, { type: 'application/pdf' });
  }

  /* ---------- 3. 다운로드 ---------- */
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  $('make').addEventListener('click', async () => {
    const btn = $('make'); btn.disabled = true;
    try {
      const q = parseFloat($('quality').value);
      const imgs = [];
      for (let i = 0; i < items.length; i++) {
        $('status').textContent = `변환 중… ${i + 1} / ${items.length}`;
        imgs.push(await toJpeg(items[i].url, q));
      }
      const pdf = buildPdf(imgs, {
        size: $('pageSize').value,
        margin: Math.max(0, parseFloat($('margin').value) || 0)
      });
      let name = ($('fname').value.trim() || '이미지모음').replace(/[\\/:*?"<>|]/g, '_');
      if (!/\.pdf$/i.test(name)) name += '.pdf';
      download(pdf, name);
      $('status').textContent = `저장 완료: ${name} (${items.length}쪽, ${(pdf.size / 1024 / 1024).toFixed(2)} MB)`;
    } catch (err) {
      $('status').textContent = '변환 실패: 읽을 수 없는 이미지가 있습니다. 해당 파일을 삭제하고 다시 시도하세요.';
      console.error(err);
    } finally { btn.disabled = items.length === 0; }
  });

  render();
})();
</script>
</body>
</html>
